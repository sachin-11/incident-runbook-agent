[project]
name = "incident-runbook-agent"
version = "0.1.0"
description = "Bedrock-based incident runbook agent with AgentOps practices (validated on a simulated environment)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.40",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "boto3-stubs[bedrock]>=1.40",
    "pre-commit>=4.0",
]
# CDK app in infra/. Separate group so Lambda bundles never pull it in.
infra = [
    "aws-cdk-lib>=2.200,<3",
    "constructs>=10.4,<11",
]

[tool.uv]
default-groups = ["dev", "infra"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "tools", "observability"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = [".", "infra"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "RUF", "SIM", "PL"]
ignore = ["PLR2004"]

[tool.ruff.lint.isort]
known-first-party = ["agent", "tools", "observability", "scripts", "stacks", "app"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106", "PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["agent", "tools", "observability", "scripts", "tests", "infra"]
mypy_path = "infra"

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "infra"]
addopts = "-q"
