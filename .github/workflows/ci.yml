name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: make lint
      - run: make typecheck
      - run: make test

  cdk-synth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Synth only: no credentials, nothing is deployed.
      IRA_AWS_REGION: us-east-1
      IRA_EMBEDDING_MODEL_ID: amazon.titan-embed-text-v2:0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync --locked
      - run: make synth
